<!doctype html>
<html lang="{{LANG}}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{SITE_TITLE}}</title>
<meta name="description" content="{{SITE_SUBTITLE}}">
<style>{{STYLE}}</style></head><body>
<header class="bar"><div class="bar-in"><a class="bar-title" href="/">{{SITE_TITLE}}</a><span class="grow"></span><span class="bar-meta">{{COUNT}} 個頁面</span></div></header>
<main>
<section class="hero"><h1>{{SITE_TITLE}}</h1><p class="sub">{{SITE_SUBTITLE}}</p></section>
<div class="grid">
{{CARDS}}
</div>
</main>
<footer><div class="in">© {{YEAR}} actcfx</div></footer>
<script>
(() => {
    const bar = document.querySelector(".bar");
    const h1 = document.querySelector(".hero h1");
    if (!bar || !h1 || !("IntersectionObserver" in window)) return;
    bar.classList.add("auto");
    new IntersectionObserver(([e]) => {
        bar.classList.toggle("vis", !e.isIntersecting && e.boundingClientRect.top < 0);
    }).observe(h1);
})();
</script>
</body></html>
