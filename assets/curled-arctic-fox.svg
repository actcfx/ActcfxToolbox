      <stop stop-color="#142e43"/><stop offset="1" stop-color="#37676e"/>
    </linearGradient>
    <linearGradient id="coat" x1=".5" y1="0" x2=".3" y2="1">
      <stop stop-color="#fff8e7"/><stop offset=".55" stop-color="#f0eddf"/><stop offset="1" stop-color="#b6ceca"/>
    </linearGradient>
    <linearGradient id="brush" x1=".65" y1=".1" x2=".4" y2=".98">
      <stop stop-color="#fff9e8"/><stop offset=".56" stop-color="#f2efde"/><stop offset="1" stop-color="#c2d6cf"/>
    </linearGradient>
