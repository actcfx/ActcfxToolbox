# Cloudflare Workers（靜態網站）設定
# 部署：Cloudflare 的 Build command 跑 `npm run build`，Deploy command 跑 `npx wrangler deploy`
name = "actcfxtoolbox"
compatibility_date = "2026-11-01"

[assets]
directory = "./dist"
not_found_handling = "404-page"

# ── 需要後端 API 時才打開（見 docs/USAGE.md）──
# main = "worker/index.js"
# [assets]  ← 上面那段 [assets] 再加這兩行：
# binding = "ASSETS"
# run_worker_first = ["/*/api/*"]
#
# [[kv_namespaces]]
# binding = "KV"
# id = "<your-kv-id>"
#
# [[d1_databases]]
# binding = "DB"
# database_name = "toolbox"
# database_id = "<your-d1-id>"
